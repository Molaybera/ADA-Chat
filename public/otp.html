<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Verification | Secure Node</title>
    <link rel="stylesheet" href="./css/otp.css">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Tactical Overlay Elements -->
    <div class="scanline"></div>
    <div class="grid-overlay"></div>

    <div class="otp-wrapper">
        <div class="terminal-container">
            <!-- Decorative Corner Brackets -->
            <div class="corner top-left"></div>
            <div class="corner top-right"></div>
            <div class="corner bottom-left"></div>
            <div class="corner bottom-right"></div>

            <div class="card-header">
                <div class="system-status">
                    <span class="pulse"></span> NODE_AWAITING_TOKEN
                </div>
                <div class="logo-icon">
                    <i class="fa-solid fa-key"></i>
                </div>
                <h1>IDENTITY_VERIFICATION</h1>
                <p class="terminal-msg">> 6-digit access token transmitted to registered comms channel...</p>
            </div>

            <form id="otp-form">

                <!-- Tactical Timer Display -->
                <div class="timer-container">
                    <p id="otp-timer" class="terminal-timer">
                        TOKEN_EXPIRATION_IN: <span id="timer-count">01:00</span>
                    </p>
                </div>

                <div class="form-group">
                    <label for="otp-code"><span class="label-code">[TOKEN]</span> ACCESS_CODE</label>
                    <div class="input-wrapper">
                        <input type="text" id="otp-code" placeholder="000000" maxlength="6" autocomplete="off" required>
                        <i class="fa-solid fa-fingerprint"></i>
                    </div>
                </div>

                <button id="btn-verify" class="primary-btn">
                    <span id="btn-text">AUTHORIZE_ACCESS</span>
                    <span id="btn-loader" class="hidden">
                        <i class="fa-solid fa-circle-notch fa-spin"></i> DECRYPTING...
                    </span>
                </button>
            </form>

            <div class="card-footer">
                <div class="divider"></div>
                <p>SIGNAL NOT RECEIVED? <a href="login.html" class="glitch-link">REINITIATE_AUTH_SEQUENCE</a></p>
            </div>
        </div>
    </div>

    <script src="./js/otp.js"></script>
</body>
</html>
