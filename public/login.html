<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Login | Secure Node</title>
    <link rel="stylesheet" href="./css/login.css">
    <!-- Font Awesome for the spinner icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Tactical Overlay Elements -->
    <div class="scanline"></div>
    <div class="grid-overlay"></div>

    <div class="login-wrapper">
        <div class="terminal-container">
            <!-- Decorative Corner Brackets -->
            <div class="corner top-left"></div>
            <div class="corner top-right"></div>
            <div class="corner bottom-left"></div>
            <div class="corner bottom-right"></div>

            <div class="card-header">
                <div class="system-status">
                    <span class="pulse"></span> NODE_AWAITING_AUTH
                </div>
                <div class="logo-icon">
                    <i class="fa-solid fa-right-to-bracket"></i>   
                </div>
                
                <h1>AGENT_AUTHENTICATION</h1>
                <p class="terminal-msg">> Verify credentials to generate secure OTP...</p>
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label for="login-email"><span class="label-code">[ID]</span> COMMS_ID (EMAIL)</label>
                    <div class="input-wrapper">
                        <input type="email" id="login-email" placeholder="AGENT_MAIL@NODE.NET" required>
                        <i class="fa-regular fa-envelope"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="login-password"><span class="label-code">[KEY]</span> ACCESS_PASSWORD</label>
                    <div class="input-wrapper">
                        <input type="password" id="login-password" placeholder="••••••••" required>
                        <i class="fa-solid fa-lock"></i>
                    </div>
                </div>

                <button id="btn-login" class="primary-btn">
                    <span id="btn-text">REQUEST_VERIFICATION_CODE</span>
                    <span id="btn-loader" class="hidden">
                        <i class="fa-solid fa-circle-notch fa-spin"></i> AUTHORIZING...
                    </span>
                </button>
            </form>

            <div class="card-footer">
                <div class="divider"></div>
                <p>NEW AGENT? <a href="register.html" class="glitch-link">ENROLL_NEW_IDENTITY</a></p>
            </div>
        </div>
    </div>

    <script src="./js/login.js"></script>
</body>
</html>
