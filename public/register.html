<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Registry | Secure Node</title>
    <link rel="stylesheet" href="./css/register.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Tactical Overlay Elements -->
    <div class="scanline"></div>
    <div class="grid-overlay"></div>

    <div class="register-wrapper">
        <div class="terminal-container">
            <!-- Decorative Corner Brackets -->
            <div class="corner top-left"></div>
            <div class="corner top-right"></div>
            <div class="corner bottom-left"></div>
            <div class="corner bottom-right"></div>

            <div class="card-header">
                <div class="system-status">
                    <span class="pulse"></span> ENCRYPTED_CHANNEL_ACTIVE
                </div>
                <div class="logo-icon">
                    <i class="fa-solid fa-user-secret"></i>
                </div>
                <h1>IDENTITY ENROLLMENT</h1>
                <p class="terminal-msg">> Initializing protocol for new agent entry...</p>
            </div>

            <form id="register-form">
                <div class="form-group">
                    <label for="reg-name"><span class="label-code">[01]</span> FULL_NAME</label>
                    <div class="input-wrapper">
                        <input type="text" id="reg-name" placeholder="AGENT_NAME_HERE" required>
                        <i class="fa-solid fa-fingerprint"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="reg-email"><span class="label-code">[02]</span> COMMS_ID (EMAIL)</label>
                    <div class="input-wrapper">
                        <input type="email" id="reg-email" placeholder="ENCRYPTED_MAIL@NODE.NET" required>
                        <i class="fa-solid fa-at"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="reg-password"><span class="label-code">[03]</span> ACCESS_KEY</label>
                    <div class="input-wrapper">
                        <input type="password" id="reg-password" placeholder="••••••••" required>
                    </div>
                    <!-- Kept IDs for JS validation logic -->
                    <div id="password-validation-box" class="validation-container"></div>
                </div>

                <!-- Kept class action-btn/primary-btn mapping as per your request -->
                <button id="btn-register" class="action-btn">
                    <span id="btn-text">AUTHORIZE_ENROLLMENT</span>
                    <span id="btn-loader" class="hidden">
                        <i class="fa-solid fa-microchip fa-spin"></i> SYNCING_NODE...
                    </span>
                </button>
            </form>

            <div class="card-footer">
                <div class="divider"></div>
                <p>EXISTING AGENT? <a href="login.html" class="glitch-link">ACCESS_LOGIN_TERMINAL</a></p>
            </div>
        </div>
    </div>

    <script src="./js/register.js"></script>
</body>
</html>
